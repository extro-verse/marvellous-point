<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Testing F1: The Movie – Apple TV+</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <style>
        :root {
            --bg: #0b0c0e;
            --primary-text: #ffffff;
            --secondary-text: #c7c7cc;
            --muted-text: #9a9aa0;
            --accent: #ffffff;
            --btn-primary-bg: #ffffff;
            --btn-primary-text: #000000;
            --btn-secondary-bg: rgba(255,255,255,0.15);
            --divider: rgba(255,255,255,0.12);
            --focus: #2997ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--primary-text);
            font-family: 'SF Pro Display', 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            line-height: 1.4;
            padding-bottom: 90px;
            scrollbar-width: thin;
            scrollbar-color: #333 #111;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #111; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #444; }

        .glassy-bg {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 24px;
            margin: 0 16px 32px;
        }

        /* Hero with dynamic background */
        .hero {
            position: relative;
            height: 85vh;
            min-height: 720px;
            display: flex;
            align-items: flex-end;
            padding: 48px;
            overflow: hidden;
        }

        .hero-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
        }

        .poster-layer, .video-layer {
            position: absolute;
            inset: 0;
            transition: opacity 2s ease-in-out;
        }

        .poster-layer {
            opacity: 1;
            background: #000;
        }

        .poster-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
        }

        .video-layer {
            opacity: 0;
        }

        #trailerPlayer {
            width: 100%;
            height: 100%;
        }

        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.45) 40%, rgba(0,0,0,0) 70%),
                        linear-gradient(180deg, rgba(0,0,0,0) 60%, rgba(0,0,0,0.85) 100%);
            z-index: 1;
            pointer-events: none;
        }

        .hero-content, .credits {
            position: relative;
            z-index: 2;
        }

        .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--secondary-text); margin-bottom: 8px; }
        .logo { font-size: 10px; font-weight: 900; letter-spacing: -0.03em; margin-bottom: 12px; color: var(--accent); }
        .img1 { size: 20px;}
        .title { font-size: 40px; font-weight: 700; letter-spacing: -0.02em; line-height: 44px; margin-bottom: 16px; }
        .metadata { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; font-size: 12px; font-weight: 500; color: var(--muted-text); opacity: 0.85; }
        .metadata span { background: var(--divider); padding: 4px 10px; border-radius: 20px; }
        .description { font-size: 14px; line-height: 20px; max-width: 520px; margin-bottom: 28px; color: var(--secondary-text); }

        .actions { display: flex; gap: 12px; margin-bottom: 32px; }
        .btn {
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: all 200ms cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary { background: var(--btn-primary-bg); color: var(--btn-primary-text); }
        .btn-secondary { background: var(--btn-secondary-bg); color: var(--primary-text); border: 1px solid var(--divider); }
        .btn:hover { transform: scale(1.05); }
        .footnote { font-size: 12px; color: var(--muted-text); }

        .credits {
            position: absolute;
            bottom: 48px;
            right: 48px;
            text-align: right;
            font-size: 13px;
            color: var(--muted-text);
        }
        .credits strong { color: var(--secondary-text); }

        /* Trailers carousel */
        .trailers { padding: 0 16px 48px; }
        .trailers h2 { font-size: 24px; margin-bottom: 20px; padding-left: 8px; }
        .trailer-grid {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding-bottom: 16px;
            scroll-behavior: smooth;
        }
        .carousel-item {
            flex: 0 0 320px;
            aspect-ratio: 16/9;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            transition: transform 0.5s ease;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }
        .carousel-item:hover { transform: scale(1.05); box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); }
        .carousel-item img { width: 100%; height: 100%; object-fit: cover; }
        .carousel-item::after {
            content: "▶";
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            color: white;
            background: rgba(0,0,0,0.4);
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }
        .carousel-item:hover::after { opacity: 1; }

        /* Responsive */
        @media (max-width: 768px) {
            .hero { height: 75vh; min-height: auto; padding: 20px; }
            .title { font-size: 28px; line-height: 36px; }
            .credits { display: none; }
            .carousel-item { flex: 0 0 280px; }
        }

        /* Bottom nav */
        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            padding: 12px 16px;
            z-index: 50;
            border-top: 1px solid #333;
        }
        nav a {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #888;
            font-size: 11px;
            text-decoration: none;
            transition: color 0.2s;
        }
        nav a:hover { color: white; }
        nav i { font-size: 22px; margin-bottom: 4px; }

        button:focus-visible, a:focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; }
    </style>
</head>

<body>

    <section class="hero" aria-labelledby="title">
        <div class="hero-bg">
            <div class="poster-layer" id="posterLayer">
                <img src="https://is1-ssl.mzstatic.com/image/thumb/5xJYlxdYAJ_jba_RBxlbuQ/1200x675sr.webp" alt="F1 The Movie Poster" class="poster-img">
            </div>
            <div class="video-layer">
                <div id="trailerPlayer"></div>
            </div>
        </div>

        <div class="hero-overlay"></div>

        <div class="hero-content">
            <div class="eyebrow">2026 Critics Choice Award Winner</div>
            <br>
            <div class="logo"><img src="https://is1-ssl.mzstatic.com/image/thumb/RHO4MKL0MT0Daq-hINei5w/432x162.png"></div>

            <div class="metadata">
                <span>Movie</span><span>Action</span><span>Drama</span><span>PG-13</span><span>2025</span><span>2h 35m</span>
            </div>

            <p class="description">
                Racing legend Sonny Hayes is coaxed into leading a struggling Formula 1 team and mentoring a young prodigy.
            </p>

            <div class="actions">
                <button class="btn btn-primary"><i class="fas fa-play"></i> Accept Free Trial</button>
                <button class="btn btn-secondary"><i class="fas fa-plus">+</i></button>
            </div>
            <div class="footnote">7 days free, then $12.99/month</div>
        </div>

        <div class="credits">
            <strong>Cast:</strong> Brad Pitt, Damson Idris, Kerry Condon<br>
            <strong>Directed by:</strong> Joseph Kosinski
        </div>
    </section>

    <section class="trailers">
        <div class="glassy-bg">
            <h2>Trailers</h2>
            <div class="trailer-grid">
                <div class="carousel-item">
                    <img src="https://img.youtube.com/vi/4DGgue0BoD8/maxresdefault.jpg" alt="Official Trailer" loading="lazy">
                </div>
                <div class="carousel-item">
                    <img src="https://img.youtube.com/vi/KsBNOAAXiCY/maxresdefault.jpg" alt="Trailer 1" loading="lazy">
                </div>
                <div class="carousel-item">
                    <img src="https://img.youtube.com/vi/n-MDGqexqjQ/maxresdefault.jpg" alt="Trailer 2" loading="lazy">
                </div>
            </div>
        </div>
    </section>

    <script>
        let player;
        const posterLayer = document.getElementById('posterLayer');
        const videoLayer = document.querySelector('.video-layer');

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('trailerPlayer', {
                height: '100%',
                width: '100%',
                videoId: '4DGgue0BoD8',  // Latest official trailer (Dec 2025 version)
                playerVars: {
                    'autoplay': 1,
                    'mute': 1,
                    'controls': 0,
                    'rel': 0,
                    'modestbranding': 1,
                    'playsinline': 1,
                    'showinfo': 0,
                    'iv_load_policy': 3,
                    'loop': 0
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            setTimeout(() => {
                posterLayer.style.opacity = '0';
                videoLayer.style.opacity = '1';
                event.target.playVideo();
            }, 3000);  // Show poster for 3 seconds initially
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                videoLayer.style.opacity = '0';
                posterLayer.style.opacity = '1';
            }
        }
    </script>

</body>
</html>
